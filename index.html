<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
        }

        .timer {
            font-size: 5rem;
            font-weight: 300;
            margin: 30px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .progress-ring {
            margin: 20px auto;
        }

        .progress-ring circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .intention-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 500;
            max-width: 80%;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .intention-display.visible {
            opacity: 1;
            visibility: visible;
        }

        .intention-input-container {
            margin: 20px 0;
        }

        .intention-input {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .intention-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .intention-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .intention-input-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="intention-display" id="intentionDisplay"></div>
    <a href="dashboard.html" style="position: fixed; top: 20px; right: 20px; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">Author Dashboard</a>
    <div class="container">
        <h1>Pomodoro Timer</h1>
        <div class="timer" id="timer">25:00</div>
        <div class="status" id="status">Ready to start</div>
        <div class="intention-input-container" id="intentionInputContainer">
            <input 
                type="text" 
                class="intention-input" 
                id="intentionInput" 
                placeholder="What do you want to focus on?"
            />
        </div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const WORK_TIME = 25 * 60; // 25 minutes in seconds
        const BREAK_TIME = 5 * 60; // 5 minutes in seconds

        let timeLeft = WORK_TIME;
        let isRunning = false;
        let isWorkTime = true;
        let intervalId = null;

        const timerElement = document.getElementById('timer');
        const statusElement = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const intentionInput = document.getElementById('intentionInput');
        const intentionDisplay = document.getElementById('intentionDisplay');
        const intentionInputContainer = document.getElementById('intentionInputContainer');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerElement.textContent = formatTime(timeLeft);
        }

        function updateStatus() {
            if (isWorkTime) {
                statusElement.textContent = isRunning ? 'Working...' : 'Work time - Ready to start';
            } else {
                statusElement.textContent = isRunning ? 'Break time!' : 'Break - Ready to start';
            }
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            updateStatus();
            
            // Show intention at top and hide input
            const intention = intentionInput.value.trim();
            if (intention) {
                intentionDisplay.textContent = intention;
                intentionDisplay.classList.add('visible');
                intentionInputContainer.classList.add('hidden');
            }

            intervalId = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(intervalId);
                    isRunning = false;
                    isWorkTime = !isWorkTime;
                    timeLeft = isWorkTime ? WORK_TIME : BREAK_TIME;
                    updateDisplay();
                    updateStatus();
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    
                    // Play a sound notification (using Web Audio API)
                    playNotification();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(intervalId);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            updateStatus();
            
            // Keep intention visible when paused
        }

        function resetTimer() {
            clearInterval(intervalId);
            isRunning = false;
            isWorkTime = true;
            timeLeft = WORK_TIME;
            updateDisplay();
            updateStatus();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            
            // Hide intention display and show input again
            intentionDisplay.classList.remove('visible');
            intentionInputContainer.classList.remove('hidden');
            intentionInput.value = '';
        }

        function playNotification() {
            // Create a simple beep sound using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // Start timer when Enter is pressed in intention input
        intentionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isRunning) {
                startTimer();
            }
        });

        // Initialize display
        updateDisplay();
        updateStatus();
    </script>
</body>
</html>
